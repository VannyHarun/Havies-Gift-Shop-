// ── Cart atom ─────────────────────────────────────────────────────────────────
function useCart() {
  const [cart, setCart] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('havies_cart') || '[]');
      return Array.isArray(saved) ? saved : [];
    } catch (error) {
      console.error('Could not restore saved cart', error);
      return [];
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem('havies_cart', JSON.stringify(cart));
    } catch (error) {
      console.error('Could not save cart for offline use', error);
    }
  }, [cart]);
  const add = useCallback((p, qty=1) => {
    setCart(c => {
      const ex = c.find(x=>x.id===p.id);
      return ex ? c.map(x=>x.id===p.id?{...x,qty:x.qty+qty}:x)
                : [...c, {...p, qty}];
    });
  },[]);
  const remove = useCallback(id => setCart(c=>c.filter(x=>x.id!==id)),[]);
  const clear = useCallback(()=>setCart([]),[]);
  const total = cart.reduce((s,x)=>s+x.price*x.qty, 0);
  const count = cart.reduce((s,x)=>s+x.qty, 0);
  return { cart, add, remove, clear, total, count };
}

// ── Wishlist atom ─────────────────────────────────────────────────────────────
function useWish() {
  const [wish, setWish] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('havies_wishlist') || '[]');
      return new Set(Array.isArray(saved) ? saved : []);
    } catch (error) {
      console.error('Could not restore saved wishlist', error);
      return new Set();
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem('havies_wishlist', JSON.stringify([...wish]));
    } catch (error) {
      console.error('Could not save wishlist for offline use', error);
    }
  }, [wish]);
  const toggle = id => setWish(w => { const n=new Set(w); n.has(id)?n.delete(id):n.add(id); return n; });
  return { wish, toggle };
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [installPrompt, setInstallPrompt] = useState(null);
  const [isOnline, setIsOnline] = useState(navigator.onLine);
  const [offlineReady, setOfflineReady] = useState(false);
  const [offlineSetupFailed, setOfflineSetupFailed] = useState(false);
  const [products, setProducts] = useState(() => {
    try {
      const saved = localStorage.getItem('havies_products');
      const parsed = saved ? JSON.parse(saved) : null;
      if (!Array.isArray(parsed)) return PRODUCTS;

      const migratedProducts = parsed.map(product =>
        product.category === 'drinkwater' ? { ...product, category: 'drinkwater' } : product
      );
      const newHandbags = PRODUCTS.filter(product =>
        ['shared-pu-leather-bag', 'shared-mini-push-lock-handbag'].includes(product.id)
      );
      return [
        ...migratedProducts,
        ...newHandbags.filter(product => !migratedProducts.some(savedProduct => savedProduct.id === product.id))
      ];
    } catch {
      return PRODUCTS;
    }
  });
  const [orders, setOrders] = useState(() => {
    try {
      const saved = localStorage.getItem('havies_orders');
      const parsed = saved ? JSON.parse(saved) : null;
      return Array.isArray(parsed) ? parsed : [];
    } catch {
      return [];
    }
  });
  const [category, setCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [sortBy, setSortBy] = useState('default');
  const [modal, setModal] = useState(null);
  const [showCart, setShowCart] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [toast, setToast] = useState('');
  const timerRef = useRef(null);

  useEffect(() => {
    const handleOnline = () => setIsOnline(true);
    const handleOffline = () => setIsOnline(false);
    const handleInstallPrompt = event => {
      event.preventDefault();
      setInstallPrompt(event);
    };
    const handleAppInstalled = () => setInstallPrompt(null);

    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    window.addEventListener('beforeinstallprompt', handleInstallPrompt);
    window.addEventListener('appinstalled', handleAppInstalled);

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register(`${APP_ASSET_BASE}sw.js`, { scope: APP_ASSET_BASE })
        .then(() => navigator.serviceWorker.ready)
        .then(() => setOfflineReady(true))
        .catch(error => {
          console.error('Could not prepare the offline shop app', error);
          setOfflineSetupFailed(true);
        });
    } else {
      setOfflineSetupFailed(true);
    }

    return () => {
      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
      window.removeEventListener('beforeinstallprompt', handleInstallPrompt);
      window.removeEventListener('appinstalled', handleAppInstalled);
    };
  }, []);

  useEffect(() => {
    try {
      localStorage.setItem('havies_products', JSON.stringify(products));
    } catch (error) {
      console.error('Could not save product catalog', error);
    }
  }, [products]);

  useEffect(() => {
    try {
      localStorage.setItem('havies_orders', JSON.stringify(orders));
    } catch (error) {
      console.error('Could not save order records', error);
    }
  }, [orders]);

  useEffect(() => {
    const productId = new URLSearchParams(window.location.search).get('product');
    const sharedProduct = products.find(product => product.id === productId);
    if (sharedProduct) setModal(sharedProduct);
  }, []);

  const { cart, add, remove, clear, total, count } = useCart();
  const { wish, toggle: toggleWish } = useWish();

  const showToast = msg => {
    setToast(msg);
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(''), 2200);
  };

  const handleInstall = async () => {
    if (!installPrompt) {
      showToast('Use your browser menu and choose Install app or Add to Home Screen.');
      return;
    }

    await installPrompt.prompt();
    const choice = await installPrompt.userChoice;
    if (choice.outcome === 'accepted') showToast('Havie’s Gift Shop app installed.');
    setInstallPrompt(null);
  };

  const handleAdd = p => {
    add(p);
    showToast(`✅ ${p.name.split(' ').slice(0,4).join(' ')} added to cart!`);
  };

  const handleAddProduct = product => {
    setProducts(current => [product, ...current]);
    showToast(`${product.name} added to the catalog.`);
  };

  const handleDeleteProduct = product => {
    if (!window.confirm(`Remove "${product.name}" from the catalog?`)) return;
    setProducts(current => current.filter(item => item.id !== product.id));
    if (modal?.id === product.id) setModal(null);
    showToast(`${product.name} removed from the catalog.`);
  };

  const handleAddOrder = order => {
    setOrders(current => [order, ...current]);
    showToast('Order recorded.');
  };

  const handleUpdateOrder = (orderId, status) => {
    setOrders(current => current.map(order => order.id === orderId ? { ...order, status } : order));
  };

  // Filter & sort
  let display = products.filter(p => {
    const matchCat = category === 'all' || p.category === category;
    const q = search.toLowerCase();
    const matchSearch = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  if (sortBy === 'price-asc') display = [...display].sort((a,b)=>a.price-b.price);
  if (sortBy === 'price-desc') display = [...display].sort((a,b)=>b.price-a.price);

  return (
    <div className="min-h-screen bg-pink-50">
      <Header cartCount={count} onCart={()=>setShowCart(true)} onAdmin={()=>setShowAdmin(true)} onInstall={handleInstall} search={search} setSearch={setSearch}/>
      <div className={`px-4 py-1.5 text-center text-xs font-semibold ${!isOnline ? 'bg-amber-100 text-amber-900' : 'bg-pink-100 text-pink-800'}`} role="status" aria-live="polite">
        {offlineSetupFailed
          ? 'Offline setup is unavailable here. Open the hosted shop online in a supported browser to save it.'
          : !isOnline
          ? offlineReady ? 'Offline mode — saved catalog is ready.' : 'Offline mode — open the shop online once to save it for offline use.'
          : offlineReady ? 'Offline catalog ready on this device.' : 'Preparing offline catalog — keep the shop open while it saves.'}
      </div>
      <Hero/>
      <CategoryTabs active={category} setActive={setCategory}/>

      {/* Sort bar */}
      <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <p className="text-sm text-gray-500 font-medium">
          Showing <strong>{display.length}</strong> {category==='all'?'products':category} items
        </p>
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)}
          className="border border-pink-200 rounded-full px-3 py-1 text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-pink-400">
          <option value="default">Sort: Default</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
        </select>
      </div>

      {/* Grid */}
      <main className="max-w-7xl mx-auto px-4 pb-16">
        {display.length === 0
          ? <div className="text-center py-20 text-gray-400">
              <div className="text-5xl mb-3">🔍</div>
              <p className="font-semibold text-lg">No products found</p>
              <button onClick={()=>{setSearch(''); setCategory('all');}}
                className="mt-4 text-pink-600 font-bold hover:underline">Clear filters</button>
            </div>
          : <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
              {display.map(p => (
                <ProductCard key={p.id} p={p}
                  onAdd={handleAdd}
                  onOpen={setModal}
                  wish={wish}
                  onWish={toggleWish}
                />
              ))}
            </div>
        }
      </main>

      <Footer/>

      {/* Modals */}
      {modal && (
        <ProductModal p={modal}
          onClose={()=>setModal(null)}
          onAdd={handleAdd}
          wish={wish}
          onWish={toggleWish}
        />
      )}
      {showCart && (
        <CartDrawer cart={cart} onRemove={remove} total={total}
          onClose={()=>setShowCart(false)} onClear={clear}
        />
      )}
      {showAdmin && (
        <AdminPanel
          products={products}
          orders={orders}
          onAddProduct={handleAddProduct}
          onDeleteProduct={handleDeleteProduct}
          onAddOrder={handleAddOrder}
          onUpdateOrder={handleUpdateOrder}
          onClose={()=>setShowAdmin(false)}
        />
      )}
      <Toast msg={toast}/>

      {/* Floating WhatsApp button */}
      <a href={`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent("Hi Havie's Gift Shop! I'm browsing your catalog online.")}`}
        target="_blank" rel="noopener noreferrer"
        className="fixed bottom-6 right-5 z-40 btn-wa text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-2xl hover:scale-110 transition spin-pulse"
        title="Chat on WhatsApp">
        💬
      </a>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
